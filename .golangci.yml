version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - predeclared
    - unconvert
    - usestdlibvars
    - depguard
    - paralleltest
  settings:
    depguard:
      rules:
        page-requests-read-cache:
          files:
            - "**/internal/app/**"
            - "**/internal/history/**"
          deny:
            - pkg: github.com/jrduncans/nwsl-season/internal/asa
              desc: Page requests must read the local SQLite cache; only the scheduler and cmd/sync may call ASA.
    paralleltest:
      # Subtests that share one browser page run in order on purpose.
      ignore-missing-subtests: true
  exclusions:
    rules:
      # Test fixtures commonly discard cleanup errors and use context-free test helpers.
      - path: _test\.go
        linters:
          - errcheck
          - noctx
      # Go runs parallel tests only after every sequential top-level test, so
      # one sequential browser test delays the whole e2e suite.
      - path-except: ^e2e/
        linters:
          - paralleltest

formatters:
  enable:
    - gofmt
    - goimports

run:
  build-tags:
    - e2e
  modules-download-mode: readonly
  relative-path-mode: gomod
  timeout: 5m
