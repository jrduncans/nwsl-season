{{define "season"}}{{template "head" .}}
<div class="title-row">
  <div><p class="eyebrow">{{.Stage}}</p><h1>{{.Season}} season</h1></div>
  <div class="title-actions"><a href="{{.FixturesPath}}">Results and fixtures</a><a href="{{.ScheduleDifficultyPath}}">Schedule difficulty</a><a class="button" href="{{.ForecastPath}}">Forecast Lab</a></div>
</div>
{{if .ScheduleNote}}<p class="data-warning"><strong>Incomplete schedule:</strong> {{.ScheduleNote}}</p>{{end}}

<section aria-label="Standings">
  {{template "currentTable" .Standings}}
</section>

{{template "foot" .}}{{end}}
