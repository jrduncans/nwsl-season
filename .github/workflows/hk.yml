name: hk

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull request pushes cancel the older run; pushes and scheduled runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Runs every hk.pkl check, the same ones the local pre-commit hook runs, since
# the hooks are installed per machine and may be missing. Markdown is checked
# too, so docs-only changes are not skipped.
jobs:
  hk:
    name: hk check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: hk validate
      - run: make check
