name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet
      - name: Test future-fixture clinching proofs and ordered scenario summaries
        run: make test-clinching
      - name: Test all packages, including Explore team rankings (direction, ties, units, league xG coverage), records, venue dates/DST, scoring balance, actual/xG comparisons, mode selections, single-basis team/league season means and original units, rolling windows, sorting and coverage
        run: make test
