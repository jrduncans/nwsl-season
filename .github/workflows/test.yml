name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet
      - name: Test future-fixture clinching proofs and ordered scenario summaries
        run: make test-clinching
      # Scatter tight/tied/zero bounds and adaptive point/logo collisions also require desktop/mobile browser checks.
      - name: Test all packages, including Explore team quadrants (selections, units, coverage, cache-only fallback), team rankings (direction, ties, units, league xG coverage), records, venue dates/DST, scoring balance, actual/xG comparisons, mode selections, points/xPoints and independent coverage, benchmark groups/cuts/ties/weighting/best holders, forecast-selected groups/Shield favorites/shared cache, panel-specific inspection/reference names and original units, rolling windows and expanding-average lead-ins, sorting and coverage
        run: make test
