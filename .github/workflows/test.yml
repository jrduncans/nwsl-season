name: Test

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull request pushes cancel the older run; pushes and scheduled runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job keeps its own Go build cache: setup-go's shared cache is saved once
# per go.sum by whichever job finishes first, so race and e2e builds were never
# cached. Pull requests restore main's latest cache and save only when none
# matched, so agent fix-up pushes don't evict main's entries.
jobs:
  # Markdown changes cannot affect Go, templates, or scripts, so docs-only pull
  # requests skip the suites here rather than through a paths-ignore trigger: a
  # workflow that never starts never reports the required Test check, and the
  # pull request stays blocked. A job skipped by its if condition reports
  # success. If this job fails, the suites run anyway.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for non-Markdown changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # HEAD is the pull request's merge commit; its first parent is the base.
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -qv '\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ hashFiles('go.sum') }}-
            go-test-
      - name: Vet
        run: make vet
      - name: Test E2E timing summaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Clinching regressions
        run: make test-clinching
      - name: Benchmark budget guards
        run: make test-guards
      - name: All packages
        run: make test
      - name: Save Go cache
        if: ${{ !cancelled() && (github.event_name == 'push' || steps.go-cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # The race suite is CPU-bound on one 4-vCPU runner, and the SQLite-heavy
  # cache and apptest packages take about half of it, so they get their own
  # runner. The other shard excludes them by name, so a new or renamed package
  # always runs in at least one shard.
  race:
    name: Race (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [sqlite, other]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-race-${{ matrix.shard }}-
      - name: Race suite
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = sqlite ]; then
            make race RACE_PACKAGES="./internal/cache ./internal/apptest"
          else
            make race RACE_PACKAGES="$(go list ./... | grep -vE '/internal/(cache|apptest)$' | tr '\n' ' ')"
          fi
      - name: Save Go cache
        if: ${{ !cancelled() && (github.event_name == 'push' || steps.go-cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  e2e-runs:
    name: E2E (${{ matrix.parallelism }}, run ${{ matrix.repetition }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    # Compare both settings twice before adopting a new concurrency limit.
    # Each run gets a separate runner and keeps the same tracing behavior.
    strategy:
      fail-fast: false
      matrix:
        parallelism: [default, parallel12]
        repetition: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-e2e-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-e2e-${{ hashFiles('go.sum') }}-
            go-e2e-
      # No browser cache: restoring one takes about as long as downloading it.
      # No --with-deps: the runner image already has Chromium's libraries, and
      # the extra fonts it adds come from a slow apt mirror. Headless launches
      # use only the headless shell, so skip the full Chrome download.
      - name: Install Chromium
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --only-shell chromium
      - name: Browser journeys
        shell: bash
        run: |
          args=()
          if [ "$E2E_PARALLELISM" = parallel12 ]; then
            args+=(-parallel=12)
          fi
          go version
          echo "Runner CPUs: $(nproc); parallelism: $E2E_PARALLELISM; repetition: $E2E_REPETITION"
          go test -tags e2e -count=1 -json "${args[@]}" ./e2e/... | tee "${E2E_PARALLELISM}-${E2E_REPETITION}.jsonl"
        env:
          E2E_PARALLELISM: ${{ matrix.parallelism }}
          E2E_REPETITION: ${{ matrix.repetition }}
          NWSL_E2E_TRACE_DIR: ${{ github.workspace }}/e2e-traces
      - name: Summarize E2E timings
        if: ${{ !cancelled() }}
        run: python3 scripts/summarize_e2e.py "${E2E_PARALLELISM}-${E2E_REPETITION}.jsonl" >> "$GITHUB_STEP_SUMMARY"
        env:
          E2E_PARALLELISM: ${{ matrix.parallelism }}
          E2E_REPETITION: ${{ matrix.repetition }}
      - name: Upload E2E timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.parallelism }}-${{ matrix.repetition }}
          path: ${{ matrix.parallelism }}-${{ matrix.repetition }}.jsonl
          if-no-files-found: error
      - name: Save Go cache
        # Only one comparison run writes the shared cache key.
        if: ${{ !cancelled() && matrix.parallelism == 'default' && matrix.repetition == 1 && (github.event_name == 'push' || steps.go-cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-e2e-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.parallelism }}-${{ matrix.repetition }}
          path: e2e-traces
          if-no-files-found: ignore

  e2e:
    name: E2E
    needs: e2e-runs
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.e2e-runs.result != 'skipped' }}
      - name: Download E2E timings
        if: ${{ needs.e2e-runs.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-timings-*
          path: e2e-timings
          merge-multiple: true
      - name: Compare E2E timings
        if: ${{ !cancelled() && needs.e2e-runs.result != 'skipped' }}
        run: python3 scripts/summarize_e2e.py e2e-timings/*.jsonl >> "$GITHUB_STEP_SUMMARY"
      - name: Check all E2E runs
        if: ${{ always() }}
        env:
          RESULT: ${{ needs.e2e-runs.result }}
        run: |
          if [ "$RESULT" != success ] && [ "$RESULT" != skipped ]; then
            echo "E2E comparison result: $RESULT"
            exit 1
          fi
