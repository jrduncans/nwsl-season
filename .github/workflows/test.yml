name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: make vet
      - name: Clinching regressions
        run: make test-clinching
      - name: Benchmark budget guards
        run: make test-guards
      - name: All packages
        run: make test

  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Race suite
        run: make race

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # No browser cache: restoring one takes about as long as downloading it.
      - name: Install Chromium
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium
      - name: Browser journeys
        run: make test-e2e
        env:
          NWSL_E2E_TRACE_DIR: ${{ github.workspace }}/e2e-traces
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e-traces
          if-no-files-found: ignore
