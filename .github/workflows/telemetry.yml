name: Telemetry Catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  telemetry-catalog:
    name: Validate telemetry catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: make telemetry-check
      - run: make telemetry-check-generated
