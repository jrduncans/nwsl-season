name: Telemetry Artifacts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  telemetry-artifacts:
    name: Validate generated telemetry artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: make telemetry-check-generated
      - run: make telemetry-live-check
