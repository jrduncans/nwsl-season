name: Telemetry Artifacts

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull request pushes cancel the older run; pushes and scheduled runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  telemetry-artifacts:
    name: Validate generated telemetry artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make telemetry-check-generated
      - run: make telemetry-live-check
