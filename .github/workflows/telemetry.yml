name: Telemetry Live Check

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pull request pushes cancel the older run; pushes and scheduled runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  telemetry-artifacts:
    name: Check runtime telemetry against the registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: make telemetry-live-check
