version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/otel*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
