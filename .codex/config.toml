# This project selects the global Go profile. The `workspace` alias handles
# Desktop Worktree sessions that request that profile name during startup.
default_permissions = "go-web"

[permissions.workspace]
extends = "go-web"

# Agent shells never start an ASA-calling server; Pitchfork daemons do not
# inherit this, so the primary checkout's server keeps its scheduler.
[shell_environment_policy]
set = { NWSL_SYNC_SCHEDULER = "false" }
