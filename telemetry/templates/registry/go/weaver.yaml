whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

params:
  error_types:
    - {id: canceled, value: canceled}
    - {id: timeout, value: timeout}
    - {id: invalid_argument, value: invalid_argument}
    - {id: invalid_data, value: invalid_data}
    - {id: conflict, value: conflict}
    - {id: upstream_failure, value: upstream_failure}
    - {id: storage_failure, value: storage_failure}
    - {id: calculation_failure, value: calculation_failure}
    - {id: other, value: _OTHER}

templates:
  - template: conventions.go.j2
    filter: >
      {
        attributes: (
          semconv_grouped_attributes({"exclude_deprecated": true})
          | map(.attributes[])
          | map(select(.name | startswith("nwsl.")))
          | unique_by(.name)
          | sort_by(.name)
        ),
        signals: (
          .groups
          | map(select((.type == "span" or .type == "event") and .name != null))
          | map(select(.name | test("^(cache|forecast|qualification|scenario|scheduler|sync)\\.")))
          | sort_by(.name)
        )
      }
    application_mode: single
    file_name: conventions.go

acronyms:
  - ASA
  - HTTP
  - ID
  - NWSL
  - UTC
  - XG

text_maps:
  attribute_method:
    boolean: Bool
    double: Float64
    int: Int
    string: String
    string[]: StringSlice
  attribute_value:
    boolean: bool
    double: float64
    int: int
    string: string
    string[]: "[]string"
