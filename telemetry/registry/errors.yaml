groups:
  - id: registry.nwsl.error
    type: attribute_group
    display_name: NWSL Season Error Attributes
    brief: Shared error and exception dimensions used by NWSL Season spans and correlated exception logs.
    note: |
      Error spans and exception logs share the same low-cardinality classification.
      The operation-specific `nwsl.error.code` identifies where the failure was detected.
      Correlated exception logs also contain the exception message and stack trace; the
      message is intentionally kept off the span because it may be high-cardinality or sensitive.
    attributes:
      - ref: error.type
        requirement_level:
          conditionally_required: Present when the operation failed.
        note: |
          NWSL Season uses `canceled`, `timeout`, `invalid_argument`, `invalid_data`,
          `conflict`, `upstream_failure`, `storage_failure`, `calculation_failure`,
          or `_OTHER`. A concrete low-cardinality Go error type may be used when it is
          more informative than `_OTHER`.
        examples: ["canceled", "timeout", "invalid_data", "upstream_failure", "_OTHER"]
      - id: nwsl.error.code
        type:
          members:
            - {id: cache_season_load, value: cache.season.load, stability: development, brief: Loading a season snapshot from the local cache failed.}
            - {id: forecast_precache, value: forecast.precache, stability: development, brief: Proactive forecast cache warming failed.}
            - {id: forecast_run, value: forecast.run, stability: development, brief: A Forecast Lab calculation failed.}
            - {id: qualification_no_help_batch, value: qualification.no_help_batch, stability: development, brief: A no-help qualification proof batch failed.}
            - {id: qualification_refresh, value: qualification.refresh, stability: development, brief: Qualification refresh or calculation failed.}
            - {id: qualification_status_proof, value: qualification.status_proof, stability: development, brief: An individual qualification status proof failed.}
            - {id: scenario_generate_team, value: scenario.generate_team, stability: development, brief: Scenario generation for one team failed.}
            - {id: scenario_refresh, value: scenario.refresh, stability: development, brief: Scenario refresh or calculation failed.}
            - {id: scheduler_planning_snapshot, value: scheduler.planning_snapshot, stability: development, brief: Reading the scheduler planning snapshot failed.}
            - {id: sync_recalculate, value: sync.recalculate, stability: development, brief: Cache-only derived-data recalculation failed.}
            - {id: sync_run, value: sync.run, stability: development, brief: A synchronization run failed.}
            - {id: sync_venue_history, value: sync.venue_history, stability: development, brief: Historical venue refresh failed.}
        stability: development
        brief: The bounded stable identifier for the operation that detected an error.
      - id: nwsl.error.expected
        type: boolean
        stability: development
        brief: Whether the failed outcome is an expected operational result rather than an unexpected defect.
        examples: [true]
      - ref: exception.type
        requirement_level:
          conditionally_required: Present on correlated exception logs.
        examples: ["timeout", "storage_failure", "calculation_failure"]
      - ref: exception.message
        requirement_level:
          conditionally_required: Present on correlated exception logs and may contain sensitive information.
        examples: ["fetch ASA games: upstream request failed"]
      - ref: exception.stacktrace
        requirement_level:
          conditionally_required: Present on correlated exception logs.

  - id: event.nwsl.exception
    type: event
    name: exception
    stability: development
    brief: A correlated exception log emitted without an operation-specific error code.
    attributes:
